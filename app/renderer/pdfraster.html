<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>PDF raster</title>
<!-- ===========================================================================
     AI-OS // PDF page rasteriser
     ---------------------------------------------------------------------------
     Served over aios-pdf://<token>/raster.html and loaded by main/pdf.js into an
     offscreen window nobody sees. It draws pages and hands back JPEGs; there is
     no viewer here, no scrolling, and nothing to click.

     It gets its own document rather than a flag on pdfview.html because the two
     want opposite things. The viewer is built to draw as little as possible --
     it frees canvases the reader has scrolled past, because a hundred-page file
     would otherwise sit in memory. This one is built to draw every page it is
     asked for, once, at a fixed size, and then be destroyed. Sharing a file
     would mean every change to one asking whether it broke the other.

     Same origin and same policy as the viewer, and for the same reason: this
     parses a file somebody was sent. It cannot reach the network -- the policy
     has no http: or https: in it -- and it has no preload bridge, so the only
     way anything leaves here is the value main/pdf.js reads back out of
     __raster(). That is a function call, not a channel it can open by itself.
     =========================================================================== -->
<style>
html, body { margin: 0; background: #fff; }
</style>
</head>
<body>
<script type="module" src="./raster.js"></script>
</body>
</html>
